services:
  sentiment_mongo:
    image: mongo:latest
    container_name: sentiment_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sentiment_network

  flask_api:
    build:
      context: ./api
    container_name: sentiment_api
    ports:
      - "5001:5001"
    depends_on:
      - sentiment_mongo
    environment:
      - MONGO_URI=mongodb://sentiment_mongo:27017/sentiment_db
      - DATA_PATH=/app/data/dataset_sentimientos_500.csv
    volumes:
      - ./data/dataset_sentimientos_500.csv:/app/data/dataset_sentimientos_500.csv:ro
    networks:
      - sentiment_network

  heart_api:
    build:
      context: ./heart_api
    container_name: heart_api
    ports:
      - "5002:5002"
    depends_on:
      - sentiment_mongo
    environment:
      - MONGO_URI=mongodb://sentiment_mongo:27017/heart_db
    networks:
      - sentiment_network

  dashboard:
    build:
      context: ./dashboard
    container_name: sentiment_dashboard
    ports:
      - "8502:8501"
    depends_on:
      - flask_api
      - heart_api
    environment:
      - MONGO_URI=mongodb://sentiment_mongo:27017/sentiment_db
      - HEART_MONGO_URI=mongodb://sentiment_mongo:27017/heart_db
      - API_URL=http://sentiment_api:5001
      - HEART_API_URL=http://heart_api:5002
      - ENRICHED_CSV=/data/dataset_final.csv
    volumes:
      - ./data/dataset_final.csv:/data/dataset_final.csv:ro
    networks:
      - sentiment_network

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark_master
    user: root
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - .:/opt/spark/work-dir
      - spark_models:/opt/spark/models
    networks:
      - sentiment_network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark_worker
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - spark_models:/opt/spark/models
    networks:
      - sentiment_network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sentiment_network

  producer:
    build:
      context: ./kafka
    container_name: heart_producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=heart-records
      - CSV_PATH=/data/heart.csv
      - DELAY_SECONDS=1.0
    volumes:
      - ./data/heart.csv:/data/heart.csv:ro
    networks:
      - sentiment_network
    restart: unless-stopped

  heart_consumer:
    build:
      context: ./heart_consumer
    container_name: heart_consumer
    user: root
    restart: always
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      /opt/spark/work-dir/process_heart.py
    depends_on:
      kafka:
        condition: service_healthy
      sentiment_mongo:
        condition: service_started
      spark-master:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=heart-records
      - MODEL_PATH=/opt/spark/models/heart_model
      - MONGO_URI=mongodb://sentiment_mongo:27017/heart_db.predictions
      - CHECKPOINT_PATH=/opt/spark/checkpoints/heart
    volumes:
      - .:/opt/spark/work-dir
      - spark_models:/opt/spark/models
      - heart_checkpoints:/opt/spark/checkpoints
    networks:
      - sentiment_network

  jenkins:
    build: .
    container_name: sentiment_jenkins
    ports:
      - "8085:8080"
    volumes:
      - /Users/yeipezz/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sentiment_network

networks:
  sentiment_network:
    driver: bridge

volumes:
  mongo_data:
  spark_models:
  heart_checkpoints: